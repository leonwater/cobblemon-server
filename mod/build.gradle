plugins {
    id 'fabric-loom' version '1.11.8'
}

version = project.mod_version
group = 'com.pokeserver'
base { archivesName = 'pokeserver' }

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file('src/main/resources/pokeserver.accesswidener')
    mods { pokeserver { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    // 개발용 스크린샷: gradle runClient -Pshot=shop (DevShot.java)
    runs { client { if (project.hasProperty('shot')) {
        vmArg "-Dpokeserver.shot=${project.shot}"
        programArgs "--width", "1280", "--height", "720"
        vmArg "-Dpokeserver.shopjson=${rootDir}/../pack/config/pokeserver/shop.json"
    } } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Cobblemon: 컴파일용 (개발 실행에선 Cobblemon이 동작하지 않아 뺌: 클래스 이름을 문자열로 찾음) (모드팩에 이미 있으므로 같이 넣지 않음). mod/install.sh가 libs/에 받아 둠
    modCompileOnly files(fileTree('libs').include('Cobblemon-*.jar').singleFile)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }
