plugins {
    id 'fabric-loom' version '1.11.8'
}

version = project.mod_version
group = 'com.pokeserver'
base { archivesName = 'pokeserver' }

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file('src/main/resources/pokeserver.accesswidener')
    mods { pokeserver { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Cobblemon: 컴파일용 (개발 실행에선 Cobblemon이 동작하지 않아 뺌: 클래스 이름을 문자열로 찾음) (모드팩에 이미 있으므로 같이 넣지 않음). mod/install.sh가 libs/에 받아 둠
    modCompileOnly files(fileTree('libs').include('Cobblemon-*.jar').singleFile)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

// 큰 자원(글꼴 4.6MB·배경음악 15MB)은 따로 pokeserver-assets-<assets_version>.jar로: 거의 안 바뀌어서
// 모드 jar(1MB 남짓)만 버전마다 바뀌고, 저장소·플레이어 다운로드가 매번 18MB씩 늘지 않음.
// 자원을 바꾸면 gradle.properties의 assets_version을 올리고 새 jar를 pack/mods에 넣음 (docs/작업규칙.md)
def heavy = ['assets/pokeserver/font/galmuri9.ttf', 'assets/pokeserver/sounds/bgm/**']
jar { exclude heavy }
def assetsJar = tasks.register('assetsJar', Jar) {
    archiveBaseName = 'pokeserver-assets'
    archiveVersion = project.assets_version
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(sourceSets.main.resources.srcDirs) { include heavy }
    from('assets-mod') { expand 'version': project.assets_version }
    preserveFileTimestamps = false; reproducibleFileOrder = true   // 다시 지어도 같은 파일 (해시가 안 바뀜)
}
tasks.named('build') { dependsOn assetsJar }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }
